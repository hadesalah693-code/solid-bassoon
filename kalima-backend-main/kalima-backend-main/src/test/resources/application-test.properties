# Used with @ActiveProfiles("test"). Datasource is overridden by Testcontainers in tests.
kalima.jwt.secret=test-jwt-secret-key-for-hardening-ci-min-32b
# Fixed value so integration tests are immune to the developer machine's JWT_ACCESS_TOKEN_EXPIRATION_MINUTES.
kalima.jwt.expiration-minutes=60
kalima.cors.allowed-origins=http://localhost:3000

# Other integration tests use many logins; keep limits high (overridden in LoginRateLimit* tests).
kalima.auth.login.max-attempts-per-window-by-ip=10000
kalima.auth.login.max-attempts-per-window-by-email=10000

# Match production-like error exposure in CI (Boot default: never; explicit for tests).
server.error.include-message=never

spring.jpa.show-sql=false
spring.flyway.enabled=true

# OCR tests run processing explicitly; avoid async races in generic OCR CRUD tests.
kalima.ocr.auto-process-on-upload=false
kalima.ocr.provider=TIKA

# Developer .env may contain malformed lines; do not fail the test JVM on parse errors.
springdotenv.ignoreIfMalformed=true
