# Local / developer defaults. Run with: --spring.profiles.active=dev
# (Maven: ./mvnw spring-boot:run -Dspring-boot.run.profiles=dev)
#
# Security: this profile supplies non-production JWT and DB defaults. Do not use in production.

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/Kalima_dev_v2}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

kalima.jwt.secret=${JWT_SECRET:dev-only-change-me-use-a-long-random-string-at-least-32-chars}
# Longer local default (8h) than production; set JWT_ACCESS_TOKEN_EXPIRATION_MINUTES=30 to mirror prod.
kalima.jwt.expiration-minutes=${JWT_ACCESS_TOKEN_EXPIRATION_MINUTES:480}

# CORS: empty allow-list → backend accepts any Origin (single-origin reverse proxy in front:
# localhost:8081 / LAN IP / Cloudflare tunnel). Set CORS_ALLOWED_ORIGINS to restrict again.
kalima.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}

# Disable Secure flag on refresh cookie for local HTTP development
kalima.auth.refresh.cookie-secure=false

# More verbose local errors; production uses never (see application-prod.properties or Boot default).
server.error.include-message=always
server.address=${SERVER_ADDRESS:0.0.0.0}

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ── Gemini (Google AI Studio) — Lawyer Assistant ────────────────
# Read from environment / .env. Never commit the real key.
gemini.api-key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-2.0-flash}
gemini.endpoint=${GEMINI_ENDPOINT:https://generativelanguage.googleapis.com/v1beta/models}
gemini.timeout-seconds=${GEMINI_TIMEOUT_SECONDS:30}
gemini.max-output-tokens=${GEMINI_MAX_OUTPUT_TOKENS:800}
gemini.temperature=${GEMINI_TEMPERATURE:0.4}

# ── Groq fallback — Lawyer Assistant ─────────────────────────────
# Used automatically when Gemini is rate-limited / unavailable.
groq.api-key=${GROQ_API_KEY:}
groq.model=${GROQ_MODEL:llama-3.3-70b-versatile}
groq.endpoint=${GROQ_ENDPOINT:https://api.groq.com/openai/v1/chat/completions}
groq.timeout-seconds=${GROQ_TIMEOUT_SECONDS:30}
groq.max-output-tokens=${GROQ_MAX_OUTPUT_TOKENS:800}
groq.temperature=${GROQ_TEMPERATURE:0.4}
groq.whisper-model=${GROQ_WHISPER_MODEL:whisper-large-v3}
groq.whisper-endpoint=${GROQ_WHISPER_ENDPOINT:https://api.groq.com/openai/v1/audio/transcriptions}

# ── Azure Speech (neural TTS — ChatGPT Voice quality) ───────────
azure.speech.key=${AZURE_SPEECH_KEY:}
azure.speech.region=${AZURE_SPEECH_REGION:eastus}
azure.speech.voice=${AZURE_SPEECH_VOICE:ar-EG-SalmaNeural}
azure.speech.timeout-seconds=${AZURE_SPEECH_TIMEOUT_SECONDS:30}
