# Production profile. No demo secrets: set DB_*, JWT_SECRET, and (for browser apps) CORS_*
# in your environment or secret store.

# Fail closed: do not include exception text in the default /error body (our ApiError in controllers is unchanged).
server.error.include-message=never

# Explicit: production browser origins only (comma-separated). If unset, list is empty and browsers
# will not receive CORS; native/API clients and same-origin are unaffected. Mobile apps and curl are unaffected.
kalima.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}
server.port=${PORT:8080}

# Render free tier (512 MB): lower startup memory and defer non-critical work.
spring.main.lazy-initialization=true
kalima.delegations.calendar-backfill-enabled=false

# Smaller connection pool on free tier.
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1

# Default to None for prod: most deployments put the SPA and API on different platforms/
# domains (e.g. Vercel + Railway), which is "cross-site" — browsers never send Strict/Lax
# cookies on cross-site fetch/XHR, silently breaking refresh-token rotation. Safe only
# because cookie-secure defaults to true (HTTPS-only). If frontend and backend instead
# share a registrable domain (app.example.com / api.example.com), override this to Strict
# via KALIMA_AUTH_REFRESH_COOKIE_SAME_SITE for stronger CSRF protection.
kalima.auth.refresh.cookie-same-site=${KALIMA_AUTH_REFRESH_COOKIE_SAME_SITE:None}