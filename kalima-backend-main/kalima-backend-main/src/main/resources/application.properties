spring.application.name=kalima-backend

# Trust X-Forwarded-For only from explicitly listed load-balancer IPs.
# With NATIVE, Tomcat's RemoteIpValve rewrites request.getRemoteAddr() — so no custom XFF
# parsing is needed in LoginRateLimiter or AuditLogService.
# IMPORTANT: Replace the value below with your actual proxy IP(s) before deploying.
# Single proxy:  172\.16\.0\.5
# Multiple:      172\.16\.0\.5|172\.16\.0\.6
server.forward-headers-strategy=NATIVE
server.tomcat.remoteip.remote-ip-header=X-Forwarded-For
server.tomcat.remoteip.protocol-header=X-Forwarded-Proto
server.tomcat.remoteip.trusted-proxies=${TRUSTED_PROXY_IPS:172\\.16\\.0\\.5}

# Database: set via environment. For local development use profile "dev" (see application-dev.properties).
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.flyway.enabled=true
# Keep DB access in the service layer; avoid lazy loading during view rendering.
spring.jpa.open-in-view=false
server.port=${PORT:8080}

# Case document uploads. Local path by default; use durable/shared storage in production.
kalima.documents.storage-dir=${KALIMA_DOCUMENTS_STORAGE_DIR:uploads/case-documents}
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=26MB

# JWT: HMAC secret from env (min 32 bytes; see JwtService). For local dev use profile "dev" with a default in application-dev.
kalima.jwt.secret=${JWT_SECRET}
# Access token lifetime (minutes). Default 30 for production SaaS; override via env without code change.
kalima.jwt.expiration-minutes=${JWT_ACCESS_TOKEN_EXPIRATION_MINUTES:30}
kalima.jwt.issuer=kalima-backend

# Login brute-force throttling (POST /api/auth/login only; in-process).
kalima.auth.login.rate-limit-enabled=${KALIMA_AUTH_LOGIN_RATE_LIMIT_ENABLED:true}
kalima.auth.login.max-attempts-per-window-by-ip=${KALIMA_AUTH_LOGIN_MAX_IP:20}
kalima.auth.login.max-attempts-per-window-by-email=${KALIMA_AUTH_LOGIN_MAX_EMAIL:10}
kalima.auth.login.window-minutes=${KALIMA_AUTH_LOGIN_WINDOW_MINUTES:15}

# Refresh token: opaque token stored as SHA-256 hash, sent via HttpOnly cookie.
# Override cookie-secure=false in application-dev.properties for local HTTP.
kalima.auth.refresh.ttl-days=${KALIMA_AUTH_REFRESH_TTL_DAYS:30}
kalima.auth.refresh.cookie-name=${KALIMA_AUTH_REFRESH_COOKIE_NAME:refresh_token}
kalima.auth.refresh.cookie-secure=${KALIMA_AUTH_REFRESH_COOKIE_SECURE:true}
# Strict works when frontend+backend share a registrable domain (e.g. app.example.com /
# api.example.com). If they are on different domains (e.g. Vercel + Railway default
# domains), set KALIMA_AUTH_REFRESH_COOKIE_SAME_SITE=None (requires cookie-secure=true)
# or the browser will silently drop the cookie on cross-site requests.
kalima.auth.refresh.cookie-same-site=${KALIMA_AUTH_REFRESH_COOKIE_SAME_SITE:Strict}

# Route "no handler" (404 on unknown paths) through GlobalExceptionHandler
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false
# Do not put exception message in default JSON error (Spring Boot 3 default: never). Dev profile can override to "always" for debugging.
# server.error.include-message left unset here — default never.

# Actuator: expose only health (public probe), info, and metrics (authenticated).
# All other endpoints stay disabled (management.endpoints.enabled-by-default=false).
management.endpoints.enabled-by-default=false
management.endpoint.health.enabled=true
management.endpoint.info.enabled=true
management.endpoint.metrics.enabled=true
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=never
management.info.env.enabled=true

# AI Agent layer (voice + night agent)
kalima.agent.confidence-threshold=${KALIMA_AGENT_CONFIDENCE_THRESHOLD:0.85}
kalima.agent.pending-action-ttl-minutes=${KALIMA_AGENT_PENDING_TTL_MINUTES:15}
kalima.agent.night-agent-cron=${KALIMA_AGENT_NIGHT_CRON:0 0 2 * * *}
kalima.agent.night-agent-enabled=${KALIMA_AGENT_NIGHT_ENABLED:true}
kalima.agent.max-tool-steps=${KALIMA_AGENT_MAX_TOOL_STEPS:8}

# Task due-date reminders (daily job for assignees).
kalima.tasks.reminder-cron=${KALIMA_TASKS_REMINDER_CRON:0 0 8 * * *}
kalima.tasks.reminder-enabled=${KALIMA_TASKS_REMINDER_ENABLED:true}

# Calendar hub
kalima.calendar.reminder-cron=${KALIMA_CALENDAR_REMINDER_CRON:0 */15 * * * *}
kalima.calendar.reminder-enabled=${KALIMA_CALENDAR_REMINDER_ENABLED:true}

# Delegations (powers of attorney)
kalima.delegations.reminder-cron=${KALIMA_DELEGATIONS_REMINDER_CRON:0 0 8 * * *}
kalima.delegations.reminder-enabled=${KALIMA_DELEGATIONS_REMINDER_ENABLED:true}
kalima.delegations.calendar-backfill-enabled=${KALIMA_DELEGATIONS_CALENDAR_BACKFILL_ENABLED:true}
kalima.delegations.documents.storage-dir=${KALIMA_DELEGATIONS_DOCUMENTS_DIR:uploads/delegation-documents}

# Lawyer Assistant document RAG
kalima.assistant.rag.enabled=${KALIMA_ASSISTANT_RAG_ENABLED:true}
kalima.assistant.rag.max-chunks=${KALIMA_ASSISTANT_RAG_MAX_CHUNKS:4}
kalima.assistant.rag.max-chars=${KALIMA_ASSISTANT_RAG_MAX_CHARS:3500}

# OCR module (scanned legal documents)
kalima.ocr.enabled=${KALIMA_OCR_ENABLED:true}
kalima.ocr.storage-dir=${KALIMA_OCR_STORAGE_DIR:uploads/ocr}
kalima.ocr.max-file-bytes=${KALIMA_OCR_MAX_FILE_BYTES:26214400}
kalima.ocr.auto-process-on-upload=${KALIMA_OCR_AUTO_PROCESS:true}
kalima.ocr.provider=${KALIMA_OCR_PROVIDER:AZURE_DI}
kalima.ocr.azure.endpoint=${AZURE_DOCUMENT_INTELLIGENCE_ENDPOINT:}
kalima.ocr.azure.key=${AZURE_DOCUMENT_INTELLIGENCE_KEY:}
kalima.ocr.azure.api-version=${KALIMA_OCR_AZURE_API_VERSION:2024-11-30}
kalima.ocr.azure.model=${KALIMA_OCR_AZURE_MODEL:prebuilt-read}
kalima.ocr.azure.timeout-seconds=${KALIMA_OCR_AZURE_TIMEOUT_SECONDS:120}
kalima.ocr.azure.poll-interval-ms=${KALIMA_OCR_AZURE_POLL_MS:1500}
kalima.ocr.azure.max-poll-attempts=${KALIMA_OCR_AZURE_MAX_POLLS:60}
